[env:esp32dev]
; Pinned to Arduino core 2.x so ledcSetup/ledcAttachPin in src/main.cpp are valid.
; If you move to espressif32 >=7 (Arduino core 3.x), switch to ledcAttach(pin,freq,res).
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
